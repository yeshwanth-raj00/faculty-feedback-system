<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Feedback</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#2563eb);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:650px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:20px;
color:#0f172a;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

select,textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.rating{
font-size:30px;
margin-top:10px;
}

.star{
cursor:pointer;
color:gray;
}

.star:hover{
color:gold;
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<div class="container">

<h1>⭐ Faculty Feedback</h1>

<label>Select Faculty</label>

<select required>
<option>Select Faculty</option>
<option>Dr. Ramesh</option>
<option>Dr. Suresh</option>
<option>Mrs. Priya</option>
<option>Mr. Ravi</option>
</select>

<label>Subject</label>

<select required>
<option>Select Subject</option>
<option>Java</option>
<option>Python</option>
<option>DBMS</option>
<option>Computer Networks</option>
</select>

<label>Overall Rating</label>

<div class="rating">
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
</div>

<label>Your Feedback</label>

<textarea rows="5" placeholder="Write your feedback here..."></textarea>

<label>Complaint (Optional)</label>

<textarea rows="4" placeholder="Write complaint if any..."></textarea>

<button onclick="submitFeedback()">Submit Feedback</button>

</div>

<script>

function submitFeedback(){

alert("✅ Thank You!\n\nYour feedback has been submitted successfully.");

}
</script>

</body>
</html>
