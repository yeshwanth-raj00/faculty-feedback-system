<!DOCTYPE html>
<html lang="en">
<head>

    <title>Faculty Feedback System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🏫 Faculty Feedback System</h1>

</header>

<div class="container">

    <div class="card">
        <h2>🎓 Student</h2>
        <p>Students can submit faculty feedback.</p>
        <button onclick="studentLogin()">Student Login</button>
    </div>

    <div class="card">
        <h2>👨‍🏫 Faculty</h2>
        <p>Faculty Portal</p>
        <button onclick="facultyLogin()">Faculty Login</button>
    </div>

    <div class="card">
        <h2>🛡 Admin</h2>
        <p>HOD • Principal • Chairman</p>
        <button onclick="adminLogin()">Admin Login</button>
    </div>

</div>

<footer>
    © 2026 Faculty Feedback System
</footer>

<script src="script.js"></script>

</body>
</html>
